<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fridge Recipe Finder</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Fridge Recipe Finder</h1>
    <p>Snap your fridge, get dinner ideas.</p>

    <!-- Option 1: take a photo with the camera -->
    <button id="camera-btn">Use camera</button>
    <section id="camera-section" hidden>
      <video id="video" autoplay playsinline muted></video>
      <br>
      <button id="snap-btn">Take photo</button>
      <button id="cancel-camera-btn">Cancel</button>
    </section>
    <canvas id="canvas" hidden></canvas>

    <!-- Option 2: upload a file -->
    <p>or choose a file:</p>
    <input type="file" id="photo" accept="image/jpeg,image/png,image/webp">
    <button id="upload-btn">Upload photo</button>

    <!-- Loading spinner and messages -->
    <p><span id="spinner" class="spinner" hidden></span> <span id="status"></span></p>

    <!-- Editable ingredient list (hidden until a photo is analysed) -->
    <section id="ingredient-section" hidden>
      <h2>Ingredients found</h2>
      <ul id="ingredient-list"></ul>
      <input type="text" id="new-ingredient" placeholder="Add an ingredient" maxlength="50">
      <button id="add-btn">Add</button>
      <br>
      <button id="find-btn">Find recipes</button>
    </section>

    <!-- Recipe results -->
    <div id="recipes"></div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
