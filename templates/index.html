<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fridge Recipe Finder</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Fridge Recipe Finder</h1>
    <p>Snap your fridge, get dinner ideas.</p>

    <!-- The file picker and button -->
    <input type="file" id="photo" accept="image/jpeg,image/png,image/webp">
    <button id="upload-btn">Upload photo</button>

    <!-- Messages appear here -->
    <p id="status"></p>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
